<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека фильмов</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <div class="header-container">
        <h1 class="page-title">🎬 Моя библиотека фильмов</h1>
        <div id="user-profile" class="user-profile" style="display: none;">
            <span id="user-greeting" class="user-greeting"></span>
            <button id="logout-btn" class="logout-button">Выйти</button>
        </div>
    </div>

    <form id="film-form" class="film-form">
        <h2 class="form-heading">Добавить фильм</h2>

        <div class="form-group full-width">
            <label for="film-title">Название:</label>
            <input type="text" id="film-title" name="film-title" autocomplete="off">
            <div id="title-error" class="error-message"></div>
        </div>

        <div class="form-group half-width">
            <label for="film-genre">Жанр:</label>
            <input type="text" id="film-genre" name="film-genre" autocomplete="off">
            <div id="genre-error" class="error-message"></div>
        </div>

        <div class="form-group half-width">
            <label for="film-year">Год:</label>
            <input type="text" id="film-year" name="film-year" inputmode="numeric" autocomplete="off">
            <div id="year-error" class="error-message"></div>
        </div>

        <div class="form-group full-width">
            <label for="film-watched" class="watched-checkbox-label">
                Я уже посмотрел этот фильм
                <input type="checkbox" id="film-watched" name="film-watched">
            </label>
        </div>

        <div class="form-group button-group">
            <input type="submit" value="Добавить фильм" class="submit-button" id="submit-btn">
            <button type="button" id="cancel-edit-btn" class="cancel-edit-button" style="display: none;">
                Отмена редактирования
            </button>
        </div>
    </form>

    <div class="filter-section">
        <h2 class="filter-heading">Поиск и фильтры</h2>
        <div class="filter-controls">
            <form id="filter-form" autocomplete="off">
                <input type="text" id="filter-title" placeholder="Название фильма">
                <input type="text" id="filter-genre" placeholder="Жанр">
                <input type="text" id="filter-year" placeholder="Год релиза" inputmode="numeric">
                <select id="filter-watched" name="filter-watched">
                    <option value="all">Все</option>
                    <option value="watched">Посмотрел</option>
                    <option value="notwatched">Не посмотрел</option>
                </select>
            </form>
            <button class="delete-all-button" type="button">Удалить все</button>
        </div>
    </div>

    <div class="table-container">
        <table id="film-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="films-body">
            </tbody>
        </table>
    </div>

    <div id="notifications-container" class="notifications-container"></div>

    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="confirm-message">Вы уверены?</p>
            <div class="modal-buttons">
                <button id="confirm-yes" class="confirm-yes-button">Да</button>
                <button id="confirm-no" class="confirm-no-button">Нет</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Добро пожаловать!</h2>
            <p>Пожалуйста, представьтесь, чтобы продолжить</p>
            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-name">Имя:</label>
                    <input type="text" id="auth-name" placeholder="Введите ваше имя" required>
                    <div id="auth-name-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="auth-email">Email:</label>
                    <input type="email" id="auth-email" placeholder="Введите ваш email" required>
                    <div id="auth-email-error" class="error-message"></div>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="submit-button">Войти</button>
                    <button type="button" id="skip-auth-btn" class="cancel-edit-button">Посмотреть функционал без входа</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
