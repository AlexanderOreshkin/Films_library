<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека фильмов</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <h1 class="heading">🎬 Моя библиотека фильмов</h1>

    <form id="film-form" class="film-form-grid">
        <h2 class="film-form__heading">Добавить фильм</h2>
        <div class="form-group full-width">
            <label for="title">Название:</label>
            <input type="text" id="title" name="title" autocomplete="off">
            <div id="title-error" class="error-message"></div>
        </div>

        <div class="form-group half-width">
            <label for="genre">Жанр:</label>
            <input type="text" id="genre" name="genre" autocomplete="off">
            <div id="genre-error" class="error-message"></div>
        </div>

        <div class="form-group half-width">
            <label for="releaseYear">Год:</label>
            <input type="text" id="releaseYear" name="releaseYear" inputmode="numeric" autocomplete="off">
            <div id="releaseYear-error" class="error-message"></div>
        </div>

        <div class="form-group full-width">
            <label for="isWatched" class="checkbox-label">Я уже посмотрел этот фильм
                <input type="checkbox" id="isWatched" name="isWatched">
            </label>
        </div>

        <div class="form-group button-group">
            <input type="submit" value="Добавить фильм" class="submit" id="submit-btn">
            <button type="button" id="cancel-edit-btn" class="cancel-btn" style="display: none;">Отмена
                редактирования</button>
        </div>
    </form>
    <div class="filter">
        <h2 class="filter__heading">Поиск и фильтры</h2>
    <div class="filter-wrapper">
        <form id="filter-form" autocomplete="off">
            
            <input type="text" id="filTitle" placeholder="Название фильма">
            <input type="text" id="filGenre" placeholder="Жанр">
            <input type="text" id="filYear" placeholder="Год релиза" inputmode="numeric">
            <select id="filWatched" name="isWatched">
                <option value="all">Все</option>
                <option value="watched">Посмотрел</option>
                <option value="notwatched">Не посмотрел</option>
            </select>
        </form>
        <button class="delete-btn delete" type="button">Удалить все</button>
    </div>
    </div>

    <!-- Обертка для адаптивного скролла таблицы -->
    <div class="table-container">
        <table id="film-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="film-tbody">
            </tbody>
        </table>
    </div>

    <!-- Контейнер для всплывающих уведомлений (Toast) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Модальное окно для подтверждения действий -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="confirm-message">Вы уверены?</p>
            <div class="modal-buttons">
                <button id="confirm-yes" class="delete">Да</button>
                <button id="confirm-no" class="cancel-btn">Нет</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
